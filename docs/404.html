<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost the window &mdash; Airframe</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#08080a" />
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #08080a;
      --text: #f3f3f5;
      --muted: #9b9ba7;
      --faint: #6f6f7a;
      --line: rgba(255, 255, 255, 0.08);
      --red: #ff2d55;
      --red-deep: #d4002a;
      --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(700px 500px at 50% -10%, rgba(255, 45, 85, 0.16), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(560px, 100%); text-align: center; }
    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: linear-gradient(145deg, #ff3b60, var(--red-deep));
      color: #fff;
      box-shadow: 0 16px 40px rgba(225, 0, 45, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    .mark svg { width: 26px; height: 26px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4.6rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.95;
    }
    h1 span {
      background: linear-gradient(135deg, #ff6a84, #ff2d55 48%, #c40027);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      max-width: 420px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }
    a:hover { transform: translateY(-1px); }
    .primary {
      background: linear-gradient(135deg, #ff3b60, var(--red-deep));
      box-shadow: 0 12px 30px rgba(225, 0, 45, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .ghost {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.035);
      color: #e4e4eb;
    }
    .ghost:hover { border-color: rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.06); }
    .foot {
      margin-top: 34px;
      color: #4b4b56;
      font-size: 9px;
    }
    .foot a { min-height: 0; padding: 0; color: #6f6f7a; font-size: 9px; font-weight: 500; }
    .foot a:hover { color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8.4 6.1 18.4 12 8.4 17.9V6.1Z" fill="currentColor"/></svg>
    </div>
    <p class="eyebrow">404 &middot; Page not found</p>
    <h1>Lost the <span>window.</span></h1>
    <p>The page you're looking for isn't here. Airframe is still where you left it &mdash; floating on top, exactly as it should be.</p>
    <div class="actions">
      <a class="primary" href="/airframe/">Back to Airframe</a>
      <a class="ghost" href="https://github.com/poshithNandyala/airframe/releases/tag/v1.5.0">Download 1.5.0</a>
    </div>
    <p class="foot">&copy; 2026 Poshith Nandyala &middot; <a href="https://github.com/poshithNandyala/airframe">GitHub</a></p>
  </main>
</body>
</html>
